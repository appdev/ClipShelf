[package]
name = "clipdock_p2p"
version = "0.1.0"
edition = "2021"
description = "Shared iroh-blobs peer-to-peer transport for ClipDock clients"

[dependencies]
anyhow = "1.0"
iroh = "0.35.0"
iroh-blobs = "0.35.0"
rand = "0.8.5"
serde_json = "1.0"
socket2 = { version = "0.5.10", features = ["all"] }
tokio = { version = "1.0", features = ["rt-multi-thread", "time"] }

[dev-dependencies]
tempfile = "3.21"
